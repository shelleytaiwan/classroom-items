<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>中文教室 ‧ 物品拖拉學習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ceiling:#46BFA4; --ceiling-d:#37A78D;
    --wall:#F3F2E3; --wall-side:#E9E8D6;
    --floor:#EE9E96; --floor-line:#F6C9C2;
    --coral:#F0705E; --coral-d:#D85B4A;
    --yellow:#F8D15A; --green:#A6DC8C; --green-d:#7FC267;
    --sky:#CDEEF2; --ink:#2E4A45; --red:#E8584A;
    --panel:#FBFAF1; --panel-line:#E6E4D2; --shadow:rgba(46,74,69,.18);
    --font-disp:"Fredoka","Noto Sans TC",sans-serif;
    --font-zh:"Noto Sans TC","Fredoka",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--font-zh); color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%, #FFF7E8 0%, #F4EFDD 55%, #EAE4CE 100%);
    min-height:100vh; overflow-x:hidden; padding:14px clamp(10px,3vw,28px) 30px;
  }

  /* top bar */
  .topbar{max-width:1320px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto;}
  .brand .logo{width:clamp(36px,6vw,46px);height:clamp(36px,6vw,46px);border-radius:14px;flex:0 0 auto;background:var(--coral);
    box-shadow:0 4px 0 var(--coral-d);display:grid;place-items:center;font-size:clamp(18px,3vw,24px);transform:rotate(-4deg);}
  .brand h1{font-family:var(--font-zh);font-weight:900;margin:0;font-size:clamp(17px,2.4vw,26px);letter-spacing:.5px;line-height:1.05;}
  .brand h1 small{display:block;font-family:var(--font-disp);font-weight:500;font-size:12px;color:#8a9a92;letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
  .controls{display:flex;flex-wrap:wrap;gap:8px;}
  .btn{font-family:var(--font-zh);font-weight:700;font-size:clamp(12px,2vw,14px);border:none;cursor:pointer;border-radius:13px;padding:clamp(7px,1.8vw,9px) clamp(10px,2.4vw,14px);
    background:#fff;color:var(--ink);box-shadow:0 3px 0 #d9d6c2;transition:transform .08s,box-shadow .08s,background .15s;
    display:inline-flex;align-items:center;gap:7px;user-select:none;}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d9d6c2;}
  .btn.on{background:var(--green);box-shadow:0 3px 0 var(--green-d);color:#234a1f;}

  .wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

  /* stage / room */
  .stage-shell{position:relative;border-radius:22px;overflow:hidden;
    box-shadow:0 18px 40px -18px var(--shadow),0 0 0 6px #fff,0 0 0 9px #ece9d6;background:var(--wall);}
  .stage{position:relative;width:100%;aspect-ratio:1400/720;}
  .stage svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .layer{position:absolute;inset:0;}

  /* token : just the object, no frame / no white box */
  .token{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;
    cursor:grab;touch-action:none;user-select:none;z-index:5;animation:pop .32s cubic-bezier(.2,1.3,.5,1) both;}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.4);}to{opacity:1;}}
  .token:active{cursor:grabbing;}
  .token.dragging{z-index:50;}
  .token .icon{position:relative;font-size:calc(clamp(48px,5.8vw,74px) * var(--scale,1));line-height:1;display:block;
    filter:drop-shadow(0 7px 6px rgba(46,74,69,.32));transition:filter .12s;}
  .token .icon svg{width:1em;height:1em;display:block;}
  .token.dragging .icon{filter:drop-shadow(0 15px 13px rgba(46,74,69,.42));}
  .token .label{background:rgba(255,255,255,.96);border-radius:12px;padding:3px 12px;text-align:center;
    box-shadow:0 3px 8px -4px var(--shadow);line-height:1.2;}
  .token .zh{font-weight:900;font-size:clamp(16px,1.9vw,21px);display:block;}
  .token .del{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;background:#fff;
    border:2px solid var(--coral);color:var(--coral);font-size:14px;font-weight:900;display:none;place-items:center;
    cursor:pointer;box-shadow:0 2px 5px -1px var(--shadow);line-height:1;z-index:2;}
  .token:hover .del, .token.tapped .del{display:grid;}
  .token .speaker{position:absolute;top:-9px;left:-9px;width:23px;height:23px;border-radius:50%;background:var(--yellow);
    display:none;place-items:center;font-size:12px;box-shadow:0 2px 4px -1px var(--shadow);pointer-events:none;z-index:2;}
  .token.speaking .speaker{display:grid;animation:beat .5s ease;}
  @keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

  /* supply palette : bare icons on a tray, no per-item box */
  .supply{background:var(--panel);border-radius:22px;padding:16px clamp(12px,2.5vw,22px) 18px;
    box-shadow:0 12px 30px -20px var(--shadow),inset 0 0 0 1px var(--panel-line);}
  .supply-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;}
  .supply-head .tag{font-weight:900;font-size:clamp(13px,2vw,16px);background:var(--yellow);color:#7a5a12;padding:5px clamp(9px,2vw,13px);border-radius:11px;box-shadow:0 3px 0 #d9b23f;}
  .supply-head .sub{font-size:clamp(11px,1.6vw,13px);color:#8a9a92;font-weight:700;}
  .tabs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
  .tab{font-family:var(--font-zh);font-weight:700;font-size:clamp(12px,2vw,14px);cursor:pointer;border:none;border-radius:11px;padding:clamp(6px,1.6vw,8px) clamp(11px,2.4vw,16px);
    background:#fff;color:#7a8a83;box-shadow:0 3px 0 #e2dfca;transition:transform .08s,box-shadow .08s;}
  .tab:active{transform:translateY(2px);box-shadow:0 1px 0 #e2dfca;}
  .tab.active{background:var(--coral);color:#fff;box-shadow:0 3px 0 var(--coral-d);}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));}
  .card{background:transparent;border:none;box-shadow:none;border-radius:16px;padding:9px 6px;text-align:center;
    cursor:grab;touch-action:none;user-select:none;position:relative;transition:transform .12s;}
  .card:hover{transform:translateY(-4px);}
  .card:active{cursor:grabbing;}
  .card .ic{font-size:clamp(44px,5.4vw,58px);line-height:1;display:flex;align-items:center;justify-content:center;
    min-height:1.15em;filter:drop-shadow(0 5px 5px rgba(46,74,69,.2));}
  .card .ic svg{width:1em;height:1em;}
  .card .ic.trio{font-size:clamp(28px,3.4vw,37px);gap:4px;}
  .card .czh{font-weight:900;font-size:clamp(13px,2vw,16px);display:block;margin-top:8px;}
  .card .qbadge{position:absolute;top:0;left:6px;background:var(--green);color:#234a1f;font-weight:900;font-size:11px;
    padding:1px 7px;border-radius:9px;box-shadow:0 2px 0 var(--green-d);z-index:2;}
  .card .play{position:absolute;top:0;right:6px;width:24px;height:24px;border-radius:50%;background:var(--yellow);border:none;
    cursor:pointer;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 3px -1px var(--shadow);opacity:0;transition:opacity .15s;z-index:2;}
  .card:hover .play{opacity:1;}

  #ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%);display:none;
    font-size:66px;line-height:1;filter:drop-shadow(0 14px 12px rgba(46,74,69,.4));}
  #ghost svg{width:1em;height:1em;display:block;}

  @media (max-width:1024px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:11px;}
  }
  @media (max-width:560px){
    .brand h1 small{display:none;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:9px;}
  }
</style>
</head>
<body>

  var PROJ='<svg viewBox="0 0 24 24"><rect x="2.4" y="7" width="19.2" height="11" rx="2.6" fill="#f1f3f5" stroke="#cfd3d9" stroke-width="0.8"/><rect x="2.4" y="7" width="19.2" height="3.4" rx="2.6" fill="#ffffff"/><circle cx="8" cy="13" r="3.4" fill="#3a3f47"/><circle cx="8" cy="13" r="2.2" fill="#6aa9c9"/><circle cx="8" cy="13" r="1" fill="#22313a"/><g stroke="#cfd3d9" stroke-width="0.8" stroke-linecap="round"><line x1="14.6" y1="10.6" x2="14.6" y2="15.4"/><line x1="16.1" y1="10.6" x2="16.1" y2="15.4"/><line x1="17.6" y1="10.6" x2="17.6" y2="15.4"/></g><rect x="13.6" y="8.4" width="5.8" height="1.1" rx="0.5" fill="#dfe3e8"/><rect x="5" y="18" width="2.2" height="1.5" rx="0.6" fill="#cfd3d9"/><rect x="16.8" y="18" width="2.2" height="1.5" rx="0.6" fill="#cfd3d9"/></svg>';

  // 白色白板（站立式）
  var WHITEBOARD='<svg viewBox="0 0 24 24"><rect x="2" y="3.5" width="20" height="13.6" rx="1.6" fill="#ffffff" stroke="#c7cdd4" stroke-width="1.1"/><rect x="3.3" y="4.8" width="17.4" height="11" rx="0.8" fill="#ffffff" stroke="#eef1f4" stroke-width="0.6"/><path d="M6 9 q3 -2 6 0 t6 0" fill="none" stroke="#5fb6e0" stroke-width="1.1" stroke-linecap="round"/><line x1="6" y1="12.4" x2="14" y2="12.4" stroke="#ef8e63" stroke-width="1.1" stroke-linecap="round"/><line x1="6" y1="14.3" x2="11" y2="14.3" stroke="#8fcf86" stroke-width="1.1" stroke-linecap="round"/><line x1="9" y1="17.1" x2="9" y2="20" stroke="#9aa3ab" stroke-width="1.2" stroke-linecap="round"/><line x1="15" y1="17.1" x2="15" y2="20" stroke="#9aa3ab" stroke-width="1.2" stroke-linecap="round"/><rect x="5" y="19.6" width="14" height="1.8" rx="0.9" fill="#b9c0c7"/></svg>';

  // 椅子（正面朝老師，椅背平行底線）
  var CHAIR='<svg viewBox="0 0 24 24"><rect x="5" y="3.6" width="14" height="6" rx="1.8" fill="#E3A968" stroke="#C2884A" stroke-width="1.1"/><rect x="4.4" y="12" width="15.2" height="3.4" rx="1.2" fill="#E3A968" stroke="#C2884A" stroke-width="1.1"/><line x1="6.6" y1="9.6" x2="6.6" y2="12.2" stroke="#C2884A" stroke-width="1.5"/><line x1="17.4" y1="9.6" x2="17.4" y2="12.2" stroke="#C2884A" stroke-width="1.5"/><line x1="6.3" y1="15.4" x2="5.6" y2="20.6" stroke="#C2884A" stroke-width="1.6" stroke-linecap="round"/><line x1="17.7" y1="15.4" x2="18.4" y2="20.6" stroke="#C2884A" stroke-width="1.6" stroke-linecap="round"/><line x1="9" y1="15.4" x2="8.7" y2="20.6" stroke="#C2884A" stroke-width="1.6" stroke-linecap="round"/><line x1="15" y1="15.4" x2="15.3" y2="20.6" stroke="#C2884A" stroke-width="1.6" stroke-linecap="round"/></svg>';

  /* zh = 漢字, ic = 圖, cat 分類. (沒有拼音/翻譯) */
  var ITEMS = [
    // 教室物品（看得出來的不放字）
    {zh:'桌子', ic:DESK, cat:'classroom', sz:'big'},
    {zh:'講桌', ic:LECTERN, cat:'classroom', sz:'big'},
    {zh:'椅子', ic:CHAIR, cat:'classroom', sz:'big'},
    {zh:'白板', ic:WHITEBOARD, cat:'classroom', sz:'big'},
    {zh:'板擦', ic:'🧽', cat:'classroom'},
    {zh:'書',   ic:'📕', cat:'classroom'},
    {zh:'課本', ic:'📗', cat:'classroom'},
    {zh:'筆記本', ic:'📓', cat:'classroom'},
    {zh:'地球儀', ic:'🌍', cat:'classroom', sz:'mid'},
    {zh:'地圖', ic:'🗺️', cat:'classroom', sz:'big'},
    {zh:'時鐘', ic:'🕐', cat:'classroom', sz:'mid'},
    {zh:'遙控器', ic:REMOTE, cat:'classroom'},
    {zh:'影印機', ic:'🖨️', cat:'classroom', sz:'mid'},
    {zh:'投影機', ic:PROJ, cat:'classroom', sz:'mid'},
    {zh:'麥克風', ic:'🎤', cat:'classroom'},
    {zh:'櫃子', ic:'🗄️', cat:'classroom', sz:'big'},
    {zh:'紙',   ic:'📃', cat:'classroom'},
    // 筆類（看不出來放漢字）
    {zh:'粉筆', ic:'✏️', cat:'pen'},
    {zh:'白板筆', ic:'🖊️', cat:'pen'},
    {zh:'麥克筆', ic:'🖍️', cat:'pen'},
    // 紙張類（看不出來放漢字）
    {zh:'影印紙', ic:'📄', cat:'paper'},
    {zh:'考卷', ic:'📝', cat:'paper'},
    {zh:'問卷', ic:'🗳️', cat:'paper'},
    {zh:'資料', ic:'🗂️', cat:'paper'},
    {zh:'講義', ic:'📜', cat:'paper'},
    {zh:'學習單', ic:'📋', cat:'paper'},
    {zh:'作業', ic:'📔', cat:'paper'},
    {zh:'報告', ic:'📑', cat:'paper'}
  ];

  var QTY3 = {};
  function hasText(it){ return it.cat==='pen' || it.cat==='paper'; }

  var SCENE = [
    {zh:'講桌',   x:30, y:84},
    {zh:'地球儀', x:15, y:53},
    {zh:'書',     x:25, y:58},
    {zh:'時鐘',   x:84, y:17},
    {zh:'地圖',   x:50, y:28},
    {zh:'板擦',   x:32, y:64}
  ];

  var stage = document.getElementById('stage');
  var layer = document.getElementById('layer');
  var grid  = document.getElementById('grid');
  var ghost = document.getElementById('ghost');
  function find(zh){ for(var i=0;i<ITEMS.length;i++) if(ITEMS[i].zh===zh) return ITEMS[i]; return null; }

  /* ---- speech ---- */
  var soundOn = true, zhVoice = null;
  function pickVoice(){
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    zhVoice = vs.find(function(v){return /zh[-_]?TW|cmn-Hant|Hant/i.test(v.lang);}) ||
              vs.find(function(v){return /zh[-_]?(HK|CN)|cmn/i.test(v.lang);}) ||
              vs.find(function(v){return /^zh/i.test(v.lang);}) || null;
  }
  if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text){
    if(!soundOn || !window.speechSynthesis) return;
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = (zhVoice && zhVoice.lang) || 'zh-TW';
      if(zhVoice) u.voice = zhVoice;
      u.rate = .85; u.pitch = 1;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---- palette ---- */
  function buildGrid(cat){
    grid.innerHTML = '';
    ITEMS.filter(function(i){return cat==='all'||i.cat===cat;}).forEach(function(it){
      var c = document.createElement('div');
      c.className = 'card';
      var trio = !!QTY3[it.zh];
      var icHTML = trio ? (it.ic+it.ic+it.ic) : it.ic;
      c.innerHTML =
        (trio ? '<span class="qbadge">×3</span>' : '')+
        '<button class="play" title="發音">🔊</button>'+
        '<span class="ic'+(trio?' trio':'')+'">'+icHTML+'</span>'+
        (hasText(it) ? '<span class="czh">'+it.zh+'</span>' : '');
      c.querySelector('.play').addEventListener('pointerdown', function(e){ e.stopPropagation(); speak(it.zh); });
      attachSpawn(c, it);
      grid.appendChild(c);
    });
  }

  /* ---- movable token ---- */
  function makeToken(it, xPct, yPct, isScene){
    var t = document.createElement('div');
    t.className = 'token' + (isScene ? ' scene' : '');
    t.style.left = xPct + '%';
    t.style.top  = yPct + '%';
    t.style.setProperty('--scale', it.sz==='big' ? 3.2 : (it.sz==='mid' ? 1.8 : 1));
    t.innerHTML =
      '<span class="del" title="移除">✕</span>'+
      '<span class="speaker">🔊</span>'+
      '<span class="icon">'+it.ic+'</span>'+
      (hasText(it) ? '<div class="label"><span class="zh">'+it.zh+'</span></div>' : '');
    t.querySelector('.del').addEventListener('pointerdown', function(e){
      e.stopPropagation();
      t.style.animation='pop .2s reverse forwards';
      setTimeout(function(){t.remove();},160);
    });
    attachMove(t, it);
    layer.appendChild(t);
    return t;
  }

  function clearTapped(){
    var ts=layer.querySelectorAll('.token.tapped');
    for(var i=0;i<ts.length;i++) ts[i].classList.remove('tapped');
  }

  /* ---- move existing token ---- */
  function attachMove(el, it){
    var startX, startY, moved, originLeft, originTop;
    el.addEventListener('pointerdown', function(e){
      if(e.target.classList.contains('del')) return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      moved = false; startX = e.clientX; startY = e.clientY;
      el._rect = stage.getBoundingClientRect();
      originLeft = parseFloat(el.style.left); originTop = parseFloat(el.style.top);
    });
    el.addEventListener('pointermove', function(e){
      if(!el.classList.contains('dragging')) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if(Math.abs(dx)>4 || Math.abs(dy)>4) moved = true;
      var r = el._rect;
      var lx = originLeft + dx / r.width * 100;
      var ly = originTop  + dy / r.height * 100;
      el.style.left = Math.max(3, Math.min(97, lx)) + '%';
      el.style.top  = Math.max(5, Math.min(95, ly)) + '%';
    });
    function end(e){
      if(!el.classList.contains('dragging')) return;
      el.classList.remove('dragging');
      try{ el.releasePointerCapture(e.pointerId);}catch(_){}
      if(!moved){
        speak(it.zh);
        clearTapped(); el.classList.add('tapped');
        el.classList.add('speaking'); setTimeout(function(){el.classList.remove('speaking');},500);
      }
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  /* ---- spawn from palette ---- */
  function attachSpawn(card, it){
    card.addEventListener('pointerdown', function(e){
      if(e.target.classList.contains('play')) return;
      e.preventDefault();
      var pid = e.pointerId, dragging = false;
      ghost.innerHTML = it.ic;
      ghost.style.display='block'; ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
      card.setPointerCapture(pid);
      function move(ev){ dragging=true; ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px'; }
      function up(ev){
        card.releasePointerCapture(pid);
        card.removeEventListener('pointermove', move);
        card.removeEventListener('pointerup', up);
        card.removeEventListener('pointercancel', up);
        ghost.style.display='none'; ghost.innerHTML='';
        var r = stage.getBoundingClientRect();
        var inside = ev.clientX>=r.left && ev.clientX<=r.right && ev.clientY>=r.top && ev.clientY<=r.bottom;
        if(!dragging){ speak(it.zh); return; }
        if(inside){
          var xPct=(ev.clientX-r.left)/r.width*100, yPct=(ev.clientY-r.top)/r.height*100;
          var tk = makeToken(it, Math.max(3,Math.min(97,xPct)), Math.max(5,Math.min(95,yPct)), false);
          speak(it.zh); tk.classList.add('speaking'); setTimeout(function(){tk.classList.remove('speaking');},500);
        }
      }
      card.addEventListener('pointermove', move);
      card.addEventListener('pointerup', up);
      card.addEventListener('pointercancel', up);
    });
  }

  function loadScene(){
    layer.innerHTML='';
    SCENE.forEach(function(s){ var it=find(s.zh); if(it) makeToken(it, s.x, s.y, true); });
  }

  /* ---- controls ---- */
  var tgSound=document.getElementById('tgSound');
  tgSound.addEventListener('click', function(){
    soundOn=!soundOn;
    tgSound.classList.toggle('on', soundOn);
    tgSound.textContent=(soundOn?'🔊':'🔇')+' 發音';
    if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  });
  document.getElementById('reset').addEventListener('click', loadScene);
  document.getElementById('clear').addEventListener('click', function(){
    layer.innerHTML='';
  });
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
      tab.classList.add('active');
      buildGrid(tab.dataset.cat);
    });
  });

  buildGrid('classroom');
  loadScene();
})();
</script>
</body>
</html>
