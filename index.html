<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中文教室</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:light;
  --bg:#EFE9DF;--card:#F8F4EC;--ink:#2B1D1A;--muted:#8C7B70;--line:#D6CCBD;--hl:#9A3F22;
  /* 教室插圖色票：彩色 */
  --ceiling:#46BFA4;--ceiling-d:#37A78D;
  --wall:#F3F2E3;--wall-side:#E9E8D6;
  --floor:#EE9E96;--floor-line:#F6C9C2;
  --coral:#F0705E;--coral-d:#D85B4A;
  --yellow:#F8D15A;--green:#A6DC8C;--green-d:#7FC267;
  --sky:#CDEEF2;--red:#E8584A
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:clamp(17px,2vw,22px);line-height:1.6;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{position:relative;max-width:950px;width:100%;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:72px 20px 48px}
.home{position:absolute;left:20px;top:calc(20px + env(safe-area-inset-top,0px));color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:2px;transition:transform .15s,box-shadow .15s,border-color .15s}
.home:hover{border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(26px,4vw,40px);letter-spacing:.12em;line-height:1.3;text-align:center}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:clamp(24px,4vh,36px)}
.wrap{flex:1;display:flex;flex-direction:column;gap:clamp(26px,4.5vh,44px);margin-top:clamp(24px,4vh,36px)}

button{font-family:inherit;font-weight:700;border-radius:2px;border:1px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;user-select:none;transition:transform .15s,box-shadow .15s}
button:hover{transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
button:focus-visible,.home:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn{font-size:clamp(15px,1.7vw,18px);padding:8px 18px}
.btn.on,.tab.active{background:var(--ink);color:var(--card)}

/* 教室場景 */
.stage-shell,.supply{width:95vw;position:relative;left:50%;transform:translateX(-50%)}
.stage-shell{border-radius:2px;overflow:hidden;border:1px solid var(--line);background:var(--wall)}
.stage{position:relative;width:100%;aspect-ratio:1400/720}
.stage svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0}
.token{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:grab;touch-action:none;user-select:none;z-index:5;animation:pop .32s cubic-bezier(.2,1.3,.5,1) both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1}}
.token:active{cursor:grabbing}
.token.dragging{z-index:50}
.token .icon{position:relative;font-size:calc(clamp(48px,5.8vw,86px) * var(--scale,1));line-height:1;display:block;filter:drop-shadow(0 4px 3px rgba(43,29,26,.28))}
.token .icon svg{width:1em;height:1em;display:block}
.token.dragging .icon{filter:drop-shadow(0 10px 8px rgba(43,29,26,.35))}
.token .label{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:2px 10px;text-align:center;line-height:1.3}
.token .zh{font-weight:700;font-size:clamp(15px,1.9vw,20px);display:block}
.token .del{position:absolute;top:-10px;right:-10px;width:24px;height:24px;border-radius:2px;background:var(--card);border:1px solid var(--hl);color:var(--hl);font-size:16px;font-weight:700;display:none;place-items:center;cursor:pointer;line-height:1;z-index:2}
.token:hover .del,.token.tapped .del{display:grid}
.token .speaker{position:absolute;top:-10px;left:-10px;min-width:24px;height:24px;padding:0 4px;border-radius:2px;background:var(--ink);color:var(--card);display:none;place-items:center;font-size:13px;font-weight:700;pointer-events:none;z-index:2}
.token.speaking .speaker{display:grid;animation:beat .5s ease}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* 備用區 */
.supply{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:22px}
.supply-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:22px}
.supply-head .tag{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(18px,2.2vw,22px)}
.tabs{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.tab{font-size:clamp(15px,1.7vw,18px);padding:8px 18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.card{background:transparent;border:none;border-radius:2px;padding:9px 6px;text-align:center;cursor:grab;touch-action:none;user-select:none;position:relative;transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card:active{cursor:grabbing}
.card .ic{font-size:clamp(44px,5.4vw,58px);line-height:1;display:flex;align-items:center;justify-content:center;min-height:1.15em;filter:drop-shadow(0 3px 3px rgba(43,29,26,.2))}
.card .ic svg{width:1em;height:1em}
.card .ic.trio{font-size:clamp(28px,3.4vw,37px);gap:4px}
.card .czh{font-weight:700;font-size:clamp(15px,1.9vw,18px);display:block;margin-top:8px}
.card .qbadge{position:absolute;top:0;left:6px;background:var(--ink);color:var(--card);font-weight:700;font-size:12px;padding:1px 7px;border-radius:2px;z-index:2}
.card .play{position:absolute;top:0;right:6px;width:auto;height:auto;padding:2px 8px;border-radius:2px;background:var(--ink);color:var(--card);border:none;font-size:13px;cursor:pointer;opacity:0;transition:opacity .15s;z-index:2}
.card .play:hover{transform:none;box-shadow:none}
.card:hover .play{opacity:1}

#ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%);display:none;font-size:66px;line-height:1;filter:drop-shadow(0 10px 8px rgba(43,29,26,.35))}
#ghost svg{width:1em;height:1em;display:block}
footer{text-align:center;padding-top:clamp(26px,4.5vh,44px);font-size:12px;letter-spacing:.06em;color:var(--muted)}
@media(max-width:640px){
  #app{padding:16px 14px 48px}
  .home{position:static;align-self:flex-start;margin-bottom:22px;font-size:14px}
  .supply{padding:20px}
  .tabs{margin-left:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
}
@media(prefers-reduced-motion:reduce){button,.home,.card{transition:none}.token{animation:none}}
.ico-spk{display:block;width:1.3em;height:1em;margin:0 auto;flex:none}
.card .play{padding:4px 8px}.card .play .ico-spk,.token .speaker .ico-spk{width:18px;height:14px}.token .speaker{padding:0 5px}
</style>
</head>

(function(){

  function getCtx(){
    if(!AC) return null;

    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }

    var b=atob(uri.slice(uri.indexOf(',')+1)), u=new Uint8Array(b.length);

  // 白色白板（站立式）
  var WHITEBOARD='<svg viewBox="0 0 24 24"><rect x="2" y="3.5" width="20" height="13.6" rx="1.6" fill="#ffffff" stroke="#c7cdd4" stroke-width="1.1"/><rect x="3.3" y="4.8" width="17.4" height="11" rx="0.8" fill="#ffffff" stroke="#eef1f4" stroke-width="0.6"/><path d="M6 9 q3 -2 6 0 t6 0" fill="none" stroke="#5fb6e0" stroke-width="1.1" stroke-linecap="round"/><line x1="6" y1="12.4" x2="14" y2="12.4" stroke="#ef8e63" stroke-width="1.1" stroke-linecap="round"/><line x1="6" y1="14.3" x2="11" y2="14.3" stroke="#8fcf86" stroke-width="1.1" stroke-linecap="round"/><line x1="9" y1="17.1" x2="9" y2="20" stroke="#9aa3ab" stroke-width="1.2" stroke-linecap="round"/><line x1="15" y1="17.1" x2="15" y2="20" stroke="#9aa3ab" stroke-width="1.2" stroke-linecap="round"/><rect x="5" y="19.6" width="14" height="1.8" rx="0.9" fill="#b9c0c7"/></svg>';

  // 椅子（正面朝老師，椅背平行底線）
  var CHAIR='<svg viewBox="0 0 24 24"><rect x="5" y="3.6" width="14" height="6" rx="1.8" fill="#E3A968" stroke="#C2884A" stroke-width="1.1"/><rect x="4.4" y="12" width="15.2" height="3.4" rx="1.2" fill="#E3A968" stroke="#C2884A" stroke-width="1.1"/><line x1="6.6" y1="9.6" x2="6.6" y2="12.2" stroke="#C2884A" stroke-width="1.5"/><line x1="17.4" y1="9.6" x2="17.4" y2="12.2" stroke="#C2884A" stroke-width="1.5"/><line x1="6.3" y1="15.4" x2="5.6" y2="20.6" stroke="#C2884A" stroke-width="1.6" stroke-linecap="round"/><line x1="17.7" y1="15.4" x2="18.4" y2="20.6" stroke="#C2884A" stroke-width="1.6" stroke-linecap="round"/><line x1="9" y1="15.4" x2="8.7" y2="20.6" stroke="#C2884A" stroke-width="1.6" stroke-linecap="round"/><line x1="15" y1="15.4" x2="15.3" y2="20.6" stroke="#C2884A" stroke-width="1.6" stroke-linecap="round"/></svg>';

  /* zh = 漢字, ic = 圖, cat 分類. (沒有拼音/翻譯) */
  var ITEMS = [
    // 教室物品（看得出來的不放字）
    {zh:'桌子', ic:DESK, cat:'classroom', sz:'big'},
    {zh:'講桌', ic:LECTERN, cat:'classroom', sz:'big'},
    {zh:'椅子', ic:CHAIR, cat:'classroom', sz:'big'},
    {zh:'白板', ic:WHITEBOARD, cat:'classroom', sz:'big'},
    {zh:'板擦', ic:'🧽', cat:'classroom'},
    {zh:'書',   ic:'📕', cat:'classroom'},
    {zh:'課本', ic:'📗', cat:'classroom'},
    {zh:'筆記本', ic:'📓', cat:'classroom'},
    {zh:'地球儀', ic:'🌍', cat:'classroom', sz:'mid'},
    {zh:'地圖', ic:'🗺️', cat:'classroom', sz:'big'},
    {zh:'時鐘', ic:'🕐', cat:'classroom', sz:'mid'},
    {zh:'遙控器', ic:REMOTE, cat:'classroom'},
    {zh:'影印機', ic:'🖨️', cat:'classroom', sz:'mid'},
    {zh:'投影機', ic:PROJ, cat:'classroom', sz:'mid'},
    {zh:'麥克風', ic:'🎤', cat:'classroom'},
    {zh:'櫃子', ic:'🗄️', cat:'classroom', sz:'big'},
    {zh:'紙',   ic:'📃', cat:'classroom'},
    // 筆類（看不出來放漢字）
    {zh:'粉筆', ic:'✏️', cat:'pen'},
    {zh:'白板筆', ic:'🖊️', cat:'pen'},
    {zh:'麥克筆', ic:'🖍️', cat:'pen'},
    // 紙張類（看不出來放漢字）
    {zh:'影印紙', ic:'📄', cat:'paper'},
    {zh:'考卷', ic:'📝', cat:'paper'},
    {zh:'問卷', ic:'🗳️', cat:'paper'},
    {zh:'資料', ic:'🗂️', cat:'paper'},
    {zh:'講義', ic:'📜', cat:'paper'},
    {zh:'學習單', ic:'📋', cat:'paper'},
    {zh:'作業', ic:'📔', cat:'paper'},
    {zh:'報告', ic:'📑', cat:'paper'}
  ];

  var QTY3 = {};
  function hasText(it){ return it.cat==='pen' || it.cat==='paper'; }

  var SCENE = [
    {zh:'講桌',   x:30, y:84},
    {zh:'地球儀', x:15, y:53},
    {zh:'書',     x:25, y:58},
    {zh:'時鐘',   x:84, y:17},
    {zh:'地圖',   x:50, y:28},
    {zh:'板擦',   x:32, y:64}
  ];

  var stage = document.getElementById('stage');
  var layer = document.getElementById('layer');
  var grid  = document.getElementById('grid');
  var ghost = document.getElementById('ghost');
  function find(zh){ for(var i=0;i<ITEMS.length;i++) if(ITEMS[i].zh===zh) return ITEMS[i]; return null; }

  /* ---- speech ---- */
  var soundOn = true, zhVoice = null;
  function pickVoice(){
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    zhVoice = vs.find(function(v){return /zh[-_]?TW|cmn-Hant|Hant/i.test(v.lang);}) ||
              vs.find(function(v){return /zh[-_]?(HK|CN)|cmn/i.test(v.lang);}) ||
              vs.find(function(v){return /^zh/i.test(v.lang);}) || null;
  }
  if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text){
    if(!soundOn) return;
    if(playClip(text)) return;
    if(!window.speechSynthesis) return;
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = (zhVoice && zhVoice.lang) || 'zh-TW';
      if(zhVoice) u.voice = zhVoice;
      u.rate = .85; u.pitch = 1;
      __spk(u);
    }catch(e){}
  }

  /* ---- palette ---- */
  function buildGrid(cat){
    grid.innerHTML = '';
    ITEMS.filter(function(i){return cat==='all'||i.cat===cat;}).forEach(function(it){
      var c = document.createElement('div');
      c.className = 'card';
      var trio = !!QTY3[it.zh];
      var icHTML = trio ? (it.ic+it.ic+it.ic) : it.ic;
      c.innerHTML =
        (trio ? '<span class="qbadge">×3</span>' : '')+
        '<button class="play" title="發音" aria-label="發音">'+SPK_SVG+'</button>'+
        '<span class="ic'+(trio?' trio':'')+'">'+icHTML+'</span>'+
        (hasText(it) ? '<span class="czh">'+it.zh+'</span>' : '');
      c.querySelector('.play').addEventListener('pointerdown', function(e){ e.stopPropagation(); speak(it.zh); });
      attachSpawn(c, it);
      grid.appendChild(c);
    });
  }

  /* ---- movable token ---- */
  function makeToken(it, xPct, yPct, isScene){
    var t = document.createElement('div');
    t.className = 'token' + (isScene ? ' scene' : '');
    t.style.left = xPct + '%';
    t.style.top  = yPct + '%';
    t.style.setProperty('--scale', it.sz==='big' ? 3.2 : (it.sz==='mid' ? 1.8 : 1));
    t.innerHTML =
      '<span class="del" title="移除">×</span>'+
      '<span class="speaker">'+SPK_SVG+'</span>'+
      '<span class="icon">'+it.ic+'</span>'+
      (hasText(it) ? '<div class="label"><span class="zh">'+it.zh+'</span></div>' : '');
    t.querySelector('.del').addEventListener('pointerdown', function(e){
      e.stopPropagation();
      t.style.animation='pop .2s reverse forwards';
      setTimeout(function(){t.remove();},160);
    });
    attachMove(t, it);
    layer.appendChild(t);
    return t;
  }

  function clearTapped(){
    var ts=layer.querySelectorAll('.token.tapped');
    for(var i=0;i<ts.length;i++) ts[i].classList.remove('tapped');
  }

  /* ---- move existing token ---- */
  function attachMove(el, it){
    var startX, startY, moved, originLeft, originTop;
    el.addEventListener('pointerdown', function(e){
      if(e.target.classList.contains('del')) return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      moved = false; startX = e.clientX; startY = e.clientY;
      el._rect = stage.getBoundingClientRect();
      originLeft = parseFloat(el.style.left); originTop = parseFloat(el.style.top);
    });
    el.addEventListener('pointermove', function(e){
      if(!el.classList.contains('dragging')) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if(Math.abs(dx)>4 || Math.abs(dy)>4) moved = true;
      var r = el._rect;
      var lx = originLeft + dx / r.width * 100;
      var ly = originTop  + dy / r.height * 100;
      el.style.left = Math.max(3, Math.min(97, lx)) + '%';
      el.style.top  = Math.max(5, Math.min(95, ly)) + '%';
    });
    function end(e){
      if(!el.classList.contains('dragging')) return;
      el.classList.remove('dragging');
      try{ el.releasePointerCapture(e.pointerId);}catch(_){}
      if(!moved){
        speak(it.zh);
        clearTapped(); el.classList.add('tapped');
        el.classList.add('speaking'); setTimeout(function(){el.classList.remove('speaking');},500);
      }
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  /* ---- spawn from palette ---- */
  function attachSpawn(card, it){
    card.addEventListener('pointerdown', function(e){
      if(e.target.classList.contains('play')) return;
      e.preventDefault();
      var pid = e.pointerId, dragging = false;
      ghost.innerHTML = it.ic;
      ghost.style.display='block'; ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
      card.setPointerCapture(pid);
      function move(ev){ dragging=true; ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px'; }
      function up(ev){
        card.releasePointerCapture(pid);
        card.removeEventListener('pointermove', move);
        card.removeEventListener('pointerup', up);
        card.removeEventListener('pointercancel', up);
        ghost.style.display='none'; ghost.innerHTML='';
        var r = stage.getBoundingClientRect();
        var inside = ev.clientX>=r.left && ev.clientX<=r.right && ev.clientY>=r.top && ev.clientY<=r.bottom;
        if(!dragging){ speak(it.zh); return; }
        if(inside){
          var xPct=(ev.clientX-r.left)/r.width*100, yPct=(ev.clientY-r.top)/r.height*100;
          var tk = makeToken(it, Math.max(3,Math.min(97,xPct)), Math.max(5,Math.min(95,yPct)), false);
          speak(it.zh); tk.classList.add('speaking'); setTimeout(function(){tk.classList.remove('speaking');},500);
        }
      }
      card.addEventListener('pointermove', move);
      card.addEventListener('pointerup', up);
      card.addEventListener('pointercancel', up);
    });
  }

  function loadScene(){
    layer.innerHTML='';
    SCENE.forEach(function(s){ var it=find(s.zh); if(it) makeToken(it, s.x, s.y, true); });
  }

  /* ---- controls ---- */
  var tgSound=document.getElementById('tgSound');
  tgSound.addEventListener('click', function(){
    soundOn=!soundOn;
    tgSound.classList.toggle('on', soundOn);
    tgSound.textContent='發音：'+(soundOn?'開':'關');
    if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  });
  document.getElementById('reset').addEventListener('click', loadScene);
  document.getElementById('clear').addEventListener('click', function(){
    layer.innerHTML='';
  });
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
      tab.classList.add('active');
      buildGrid(tab.dataset.cat);
    });
  });

  buildGrid('classroom');
  loadScene();
})();
</script>
</body>
</html>
